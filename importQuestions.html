    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            color: #222;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #status {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            background: #f1f5f9;
            line-height: 1.6;
        }

        .success {
            color: green;
            font-weight: bold;
        }

        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

            subtopic,

    /* =========================================================
       IMPORT FUNCTION
       ========================================================= */

    async function importQuestions() {

        const button = document.getElementById("importButton");
        const status = document.getElementById("status");

        try {

            button.disabled = true;

            status.innerHTML = "Connecting to Firebase...";

            /* -------------------------------------------------
               SIGN IN ANONYMOUSLY
               ------------------------------------------------- */

            if (!auth.currentUser) {
                await signInAnonymously(auth);
            }

            status.innerHTML =
                `Firebase connected successfully.<br><br>
                 Preparing ${questions.length} questions...`;


            /* -------------------------------------------------
               CREATE FIRESTORE BATCH
               ------------------------------------------------- */

            const batch = writeBatch(db);


            /* -------------------------------------------------
               ADD ALL QUESTIONS TO BATCH
               ------------------------------------------------- */

            questions.forEach((question) => {

                const questionRef = doc(
                    db,
                    "questionBank",
                    question.id
                );

                batch.set(questionRef, {

                    level: question.level,

                    topic: question.topic,

                    subtopic: question.subtopic,

                    difficulty: question.difficulty,

                    questionType: question.questionType,

                    skill: question.skill,

                    prerequisite: question.prerequisite,

                    question: question.question,

                    options: question.options,

                    correctAnswer: question.correctAnswer,

                    explanation: question.explanation,

                    active: question.active

                });

            });


            /* -------------------------------------------------
               UPLOAD
               ------------------------------------------------- */

            status.innerHTML =
                `Uploading ${questions.length} questions to Firestore...`;

            await batch.commit();


            /* -------------------------------------------------
               SUCCESS
               ------------------------------------------------- */

            status.innerHTML =
                `<span class="success">
                    SUCCESS!<br><br>
                    ${questions.length} questions have been imported
                    into Firestore.<br><br>
                    Collection: <strong>questionBank</strong>
                </span>`;

            console.log(
                `SUCCESS: ${questions.length} questions imported.`
            );


        } catch (error) {

            console.error("IMPORT ERROR:", error);

            status.innerHTML =
                `<span class="error">
                    IMPORT FAILED<br><br>
                    ${error.message}
                </span>`;

            button.disabled = false;
        }
    }

       BUTTON EVENT
       ========================================================= */

    document
        .getElementById("importButton")
        .addEventListener("click", importQuestions);
